## 슬라이드 유형별 상세 가이드\r
\r
### 1. 표지 슬라이드 (Title Slide)\r
**필수 요소**:\r
- 메인 제목: 임팩트 있고 명확한 한 문장 (15자 이내 권장)\r
- 부제목: 주제의 범위나 맥락 설명\r
- 발표자 정보: 이름, 직책, 소속\r
- 발표 일자\r
- 회사/기관 로고\r
\r
**선택 요소**:\r
- 배경 이미지 (주제와 관련된 고품질 이미지)\r
- 컨퍼런스/행사명\r
\r
### 2. Executive Summary 슬라이드\r
**필수 요소**:\r
- 핵심 발견사항 3-5개 (불릿 포인트)\r
- 각 포인트는 완성된 문장으로 작성\r
- 가장 중요한 결론이나 권고사항 강조\r
\r
**작성 팁**:\r
- "So what?"에 답하는 내용\r
- 바쁜 경영진이 이 슬라이드만 봐도 요점 파악 가능하도록\r
\r
### 3. 목차 슬라이드 (Agenda)\r
**필수 요소**:\r
- 3-5개 섹션 (너무 많으면 복잡해 보임)\r
- 각 섹션별 간단한 설명 (선택)\r
- 섹션 번호 또는 아이콘\r
\r
**선택 요소**:\r
- 예상 소요 시간\r
- 현재 섹션 하이라이트 (반복 사용 시)\r
\r
### 4. 현황/배경 슬라이드 (Context/Background)\r
**필수 요소**:\r
- 현재 상황 설명\r
- 왜 이 주제가 중요한지\r
- 어떤 문제/기회가 있는지\r
\r
**콘텐츠 깊이**:\r
- 구체적 수치와 데이터로 뒷받침\r
- 시장 규모, 성장률, 트렌드 등 포함\r
\r
### 5. 데이터/통계 슬라이드\r
**필수 요소**:\r
- 명확한 차트 제목 (결론을 담은)\r
- 하나의 핵심 메시지에 집중\r
- 데이터 출처 및 시점\r
- 단위 명시\r
\r
**차트 선택 가이드**:\r
| 목적 | 권장 차트 |\r
|------|-----------|\r
| 추세 비교 | 선 그래프 |\r
| 카테고리 비교 | 막대 그래프 |\r
| 구성비 | 파이/도넛 차트 |\r
| 상관관계 | 산점도 |\r
| 지역 분포 | 지도 |\r
| 흐름/프로세스 | 플로우차트/Sankey |\r
\r
**작성 팁**:\r
- 차트 제목은 결론 형태로 (예: "매출 20% 성장" vs "연도별 매출")\r
- 핵심 수치는 크게 강조\r
- 불필요한 장식 요소 제거\r
\r
### 6. 비교 분석 슬라이드\r
**필수 요소**:\r
- 비교 기준 명확히 정의\r
- 2-4개 항목 비교 (너무 많으면 복잡)\r
- 각 항목의 장단점\r
- 명확한 결론/권장안\r
\r
**레이아웃 옵션**:\r
- 표 형식 (다수 기준 비교)\r
- 2분할 레이아웃 (2개 항목 심층 비교)\r
- 매트릭스 (2개 축 기준 비교)\r
\r
### 7. 프로세스/타임라인 슬라이드\r
**필수 요소**:\r
- 단계별 명확한 구분\r
- 각 단계의 주요 활동/산출물\r
- 단계 간 연결 관계\r
\r
**선택 요소**:\r
- 예상 소요 시간\r
- 담당자/책임자\r
- 마일스톤\r
\r
### 8. 사례 연구 슬라이드 (Case Study)\r
**필수 요소**:\r
- 사례 배경 (회사/상황 설명)\r
- 문제/도전 과제\r
- 해결 방안\r
- 결과 및 성과 (정량적 수치)\r
- 시사점\r
\r
**작성 팁**:\r
- 구체적 회사명과 수치 포함\r
- Before/After 비교 효과적\r
- 청중과 관련성 있는 사례 선택\r
\r
### 9. 인용 슬라이드 (Quote)\r
**필수 요소**:\r
- 인용문 (큰따옴표로 표시)\r
- 출처 (인물, 직책, 조직, 연도)\r
- 맥락 설명 (왜 이 인용이 중요한지)\r
\r
**작성 팁**:\r
- 권위 있는 출처 선택\r
- 핵심 메시지를 강화하는 인용\r
- 너무 긴 인용은 핵심만 발췌\r
\r
### 10. 요약/결론 슬라이드\r
**필수 요소**:\r
- 핵심 Takeaways 3-5개\r
- 각 포인트는 actionable한 문장\r
- 다음 단계/Call to Action\r
\r
**작성 팁**:\r
- 새로운 정보 추가하지 않음\r
- 앞서 말한 내용의 핵심만 정리\r
- 청중이 기억해야 할 것에 집중\r
\r
### 11. 권고사항/제언 슬라이드\r
**필수 요소**:\r
- 구체적인 권고사항 3-5개\r
- 각 권고사항의 근거\r
- 우선순위 (있을 경우)\r
- 예상 효과/영향\r
\r
**작성 팁**:\r
- "해야 한다"보다 "하면 ~한 효과"\r
- 실행 가능한 구체적 제안\r
- 리소스/비용 고려사항 포함\r
\r
---\r
\r
## 콘텐츠 작성 원칙\r
\r
### 1. MECE 원칙 (Mutually Exclusive, Collectively Exhaustive)\r
- 각 섹션이 중복 없이 상호 배타적\r
- 전체적으로 주제를 빠짐없이 포괄\r
\r
### 2. 피라미드 원칙 (Pyramid Principle)\r
- 결론 먼저, 근거는 그 다음\r
- 가장 중요한 메시지를 먼저 전달\r
- 상세 내용은 뒤에서 뒷받침\r
\r
### 3. 한 슬라이드 한 메시지 (One Slide, One Message)\r
- 슬라이드당 하나의 핵심 포인트만\r
- 제목이 곧 결론이 되도록\r
\r
### 4. 구체성 원칙 (Be Specific)\r
- 추상적 표현 대신 구체적 수치\r
- "많은" → "78%", "상당한" → "3배 증가"\r
\r
### 5. 6x6 규칙 (완화 버전)\r
- 한 슬라이드에 6줄 이하\r
- 한 줄에 10단어 이하\r
- 단, 필요시 서브 불릿 허용\r
\r
### 6. 시각적 일관성\r
- 동일한 정보는 동일한 형식으로\r
- 색상, 폰트, 레이아웃 통일\r
- 강조 방식 일관되게 사용\r
\r
---\r
\r
## 스토리텔링 프레임워크\r
\r
### SCQA 프레임워크\r
- **Situation (상황)**: 현재 상황 설명\r
- **Complication (문제)**: 문제나 도전 과제\r
- **Question (질문)**: 해결해야 할 핵심 질문\r
- **Answer (답변)**: 해결책/권고사항\r
\r
### Problem-Solution 프레임워크\r
1. 문제 정의 → 2. 원인 분석 → 3. 해결책 제시 → 4. 기대 효과\r
\r
### What-So What-Now What 프레임워크\r
- **What**: 무슨 일이 일어나고 있는가?\r
- **So What**: 왜 중요한가?\r
- **Now What**: 어떻게 해야 하는가?\r
\r
---\r
\r
## 품질 체크리스트\r
\r
### 내용 검증\r
- [ ] 모든 데이터의 출처가 명시되어 있는가?\r
- [ ] 수치와 통계가 정확한가?\r
- [ ] 핵심 메시지가 명확한가?\r
- [ ] 논리적 흐름이 자연스러운가?\r
- [ ] 청중의 수준에 맞는 용어를 사용했는가?\r
- [ ] 중복되는 내용이 없는가?\r
\r
### 구조 검증\r
- [ ] 슬라이드 수가 발표 시간에 적절한가? (2-3분/슬라이드)\r
- [ ] 섹션 간 균형이 맞는가?\r
- [ ] 전환이 자연스러운가?\r
- [ ] Executive Summary가 전체 내용을 잘 요약하는가?\r
\r
### 시각 요소 검증\r
- [ ] 차트 유형이 데이터에 적합한가?\r
- [ ] 시각 요소가 메시지를 강화하는가?\r
- [ ] 불필요한 장식 요소는 없는가?\r
\r
---\r
\r
## 주의사항\r
\r
- **과도한 텍스트 지양**: 슬라이드는 발표자의 말을 보조하는 도구\r
- **복잡한 데이터 단순화**: 핵심 인사이트에 집중\r
- **청중 수준에 맞는 용어**: 불필요한 전문용어 피하기\r
- **핵심에 집중**: "Nice to have" 정보는 부록으로\r
- **일관성 유지**: 형식, 용어, 스타일의 일관성\r
- **출처 명시**: 모든 외부 데이터/인용의 출처 표기\r
- **시간 관리**: 슬라이드 수와 발표 시간의 균형"""
