<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #2D2D2D; overflow: hidden; color: #F8FAF8; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 100%; height: 100%; padding: 48pt 58pt 40pt; display: flex; flex-direction: column; justify-content: center; gap: 20pt; }
    .lead p { font-size: 14pt; font-weight: 700; color: #B8C4B8; line-height: 1.4; }
    .quote h1 { font-size: 39pt; font-weight: 800; color: #F8FAF8; line-height: 1.24; letter-spacing: 0; }
    .support { max-width: 540pt; border-top: 1.5pt solid rgba(248, 250, 248, 0.25); padding-top: 16pt; }
    .support p { font-size: 13.5pt; font-weight: 400; color: #D7DDD7; line-height: 1.56; }
    .brand h2 { margin-top: 4pt; font-size: 28pt; font-weight: 800; color: #F8FAF8; line-height: 1.28; }
    .brand p { margin-top: 5pt; font-size: 14pt; font-weight: 500; color: #D7DDD7; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="lead"><p>Verso가 제안하는 결론</p></div>
    <div class="quote"><h1>책과의 새로운 만남은,<br>우연에만 맡기지 않고 설계할 수 있습니다.</h1></div>
    <div class="support">
      <p>대형서점은 많은 책을 가지고 있지만, 사용자는 그 안에서 선택의 어려움을 겪습니다. Verso는 취향, 서점 공간, LLM 추천 기술, 자율주행 이동체를 하나의 경험으로 연결합니다.</p>
    </div>
    <div class="brand"><h2>Verso</h2><p>더 다양한 책을 발견하는 서점 경험</p></div>
  </div>
</body>
</html>
