<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #2C2C2C; overflow: hidden; color: #FDFCF8; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 100%; height: 100%; position: relative; padding: 54pt 42pt 30pt; display: grid; grid-template-columns: 0.82fr 1.18fr; gap: 24pt; }
    .section-badge { position: absolute; top: 16pt; left: 28pt; }
    .section-badge p { display: inline-block; font-size: 10.5pt; font-weight: 800; color: #2C2C2C; background: #E5D1B3; padding: 4pt 10pt; border-radius: 99pt; line-height: 1.1; }
    .title { display: flex; flex-direction: column; justify-content: space-between; border-right: 1.5pt solid rgba(253, 252, 248, 0.28); padding-right: 22pt; }
    .title h1 { font-size: 27pt; font-weight: 800; line-height: 1.28; color: #FDFCF8; }
    .title p { font-size: 11.5pt; font-weight: 600; line-height: 1.45; color: #E5D1B3; }
    .tags { display: flex; flex-wrap: wrap; gap: 6pt; }
    .tags .tag p { font-size: 9.8pt; font-weight: 800; line-height: 1; color: #2C2C2C; background: #E5D1B3; border-radius: 99pt; padding: 5pt 8pt; }
    .content { display: flex; flex-direction: column; justify-content: center; gap: 13pt; }
    .card { background: #FDFCF8; border-radius: 8pt; padding: 15pt 17pt; }
    .card h2 { font-size: 16pt; font-weight: 800; color: #2C2C2C; line-height: 1.25; }
    .card p { margin-top: 6pt; font-size: 11.8pt; font-weight: 500; color: #555555; line-height: 1.46; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-badge"><p>6 평가</p></div>
    <div class="title">
      <h1>경제성 측면</h1>
      <p>기존 공간과 재고 활용</p>
      <div class="tags"><div class="tag"><p>공간 활용</p></div><div class="tag"><p>파일럿 적용</p></div><div class="tag"><p>전환율</p></div></div>
    </div>
    <div class="content">
      <div class="card"><h2>기여 방식</h2><p>기존 대형서점의 공간과 재고를 활용하기 때문에 완전히 새로운 매장을 구축하는 것보다 초기 부담을 줄일 수 있습니다.</p></div>
      <div class="card"><h2>평가 및 개선</h2><p>일부 장르나 특정 코너에서 먼저 검증한 뒤, 추천 정확도와 구매 전환율을 확인하며 확대합니다.</p></div>
    </div>
  </div>


</body></html>
