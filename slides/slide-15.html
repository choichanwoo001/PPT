<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #B8C4B8; overflow: hidden; color: #1A1A1A; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 100%; height: 100%; position: relative; padding: 54pt 42pt 30pt; display: grid; grid-template-columns: 0.82fr 1.18fr; gap: 24pt; }
    .section-badge { position: absolute; top: 16pt; left: 28pt; }
    .section-badge p { display: inline-block; font-size: 10.5pt; font-weight: 800; color: #F8FAF8; background: #2D2D2D; padding: 4pt 10pt; border-radius: 99pt; line-height: 1.1; }
    .title { display: flex; flex-direction: column; justify-content: space-between; border-right: 1.5pt solid rgba(45, 45, 45, 0.26); padding-right: 22pt; }
    .title h1 { font-size: 27pt; font-weight: 800; line-height: 1.28; color: #2D2D2D; }
    .title p { font-size: 11.5pt; font-weight: 700; line-height: 1.45; color: #F8FAF8; background: #2D2D2D; border-radius: 99pt; padding: 5pt 10pt; align-self: flex-start; }
    .content { display: flex; flex-direction: column; justify-content: center; gap: 13pt; }
    .card { background: #F8FAF8; border-radius: 8pt; padding: 15pt 17pt; }
    .card h2 { font-size: 16pt; font-weight: 800; color: #2D2D2D; line-height: 1.25; }
    .card p { margin-top: 6pt; font-size: 11.8pt; font-weight: 500; color: #3D3D3D; line-height: 1.46; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-badge"><p>6 평가</p></div>
    <div class="title">
      <h1>사회적 측면</h1>
      <p>다양한 저자와 주제의 발견</p>
    </div>
    <div class="content">
      <div class="card"><h2>기여 방식</h2><p>베스트셀러 중심의 선택을 완화하고, 독자가 더 다양한 저자와 주제를 발견하도록 도울 수 있습니다.</p></div>
      <div class="card"><h2>평가 및 개선</h2><p>추천이 특정 장르나 출판사에 치우치지 않도록 주기적으로 점검해야 합니다.</p></div>
    </div>
  </div>


</body></html>
