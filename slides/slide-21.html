<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #2D2D2D; overflow: hidden; color: #F8FAF8; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 720pt; height: 405pt; overflow: hidden; position: relative; padding: 48pt 58pt 40pt; display: flex; flex-direction: column; justify-content: center; gap: 20pt; }
    .lead p { font-size: 14pt; font-weight: 750; color: #B8C4B8; line-height: 1.4; }
    .quote h1 { max-width: 585pt; font-size: 38pt; font-weight: 850; color: #F8FAF8; line-height: 1.24; letter-spacing: 0; }
    .support { max-width: 560pt; border-top: 1.5pt solid rgba(248, 250, 248, 0.25); padding-top: 16pt; }
    .support p { font-size: 13.3pt; font-weight: 450; color: #D7DDD7; line-height: 1.58; }
    .brand { display: flex; align-items: flex-end; justify-content: space-between; gap: 24pt; }
    .brand h2 { margin-top: 4pt; font-size: 28pt; font-weight: 850; color: #F8FAF8; line-height: 1.28; }
    .brand p { margin-top: 5pt; font-size: 14pt; font-weight: 550; color: #D7DDD7; line-height: 1.4; }
    .brand img { width: 78pt; height: 78pt; object-fit: contain; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="lead"><p>마지막으로 결론입니다.</p></div>
    <div class="quote"><h1>책과의 새로운 만남은,<br>우연에만 맡기지 않고 설계할 수 있습니다.</h1></div>
    <div class="support">
      <p>Verso는 사용자의 취향, 서점이라는 공간, LLM 기반 추천 기술, 그리고 자율주행 이동체를 하나의 경험으로 연결합니다. 이를 통해 독자는 더 다양한 책을 발견하고, 서점은 기존 공간 안에서 새로운 탐색 경험을 제공할 수 있습니다.</p>
    </div>
    <div class="brand">
      <div><h2>Verso</h2><p>이상으로 발표를 마치겠습니다. 감사합니다.</p></div>
      <img src="./assets/sanchaek-mascot.png" alt="Verso 마스코트">
    </div>
  </div>
</body>
</html>
