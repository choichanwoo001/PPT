<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #E5D1B3; overflow: hidden; color: #1A1A1A; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 100%; height: 100%; position: relative; padding: 48pt 38pt 28pt; display: flex; flex-direction: column; gap: 13pt; }
    .section-badge { position: absolute; top: 16pt; left: 26pt; }
    .section-badge p { display: inline-block; font-size: 10.5pt; font-weight: 800; color: #FDFCF8; background: #2C2C2C; padding: 4pt 10pt; border-radius: 99pt; line-height: 1.1; }
    .headline h1 { font-size: 25pt; font-weight: 850; color: #2C2C2C; line-height: 1.3; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12pt; }
    .card { border-radius: 8pt; padding: 17pt 18pt; min-height: 122pt; }
    .phone { background: #FDFCF8; border: 1.4pt solid rgba(44, 44, 44, 0.18); }
    .robot { background: #2C2C2C; }
    .card h2 { font-size: 18pt; font-weight: 850; line-height: 1.25; }
    .phone h2 { color: #2C2C2C; }
    .robot h2 { color: #FDFCF8; }
    .card p { margin-top: 8pt; font-size: 12.3pt; font-weight: 500; line-height: 1.48; }
    .phone p { color: #555555; }
    .robot p { color: #E5D1B3; }
    .map { flex: 1; background: #FDFCF8; border-radius: 8pt; padding: 16pt 18pt; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 18pt; align-items: center; }
    .route { position: relative; height: 118pt; border: 1.2pt solid #EADCC7; border-radius: 8pt; background: #FAF4EA; }
    .shelf { position: absolute; background: #D7C09E; border-radius: 4pt; }
    .s1 { left: 16pt; top: 18pt; width: 86pt; height: 18pt; }
    .s2 { right: 18pt; top: 22pt; width: 92pt; height: 18pt; }
    .s3 { left: 30pt; bottom: 22pt; width: 118pt; height: 18pt; }
    .path { position: absolute; left: 70pt; top: 46pt; width: 190pt; height: 42pt; border-top: 3pt dashed #2C2C2C; border-right: 3pt dashed #2C2C2C; border-radius: 0 28pt 0 0; }
    .dot { position: absolute; width: 15pt; height: 15pt; border-radius: 99pt; background: #2C2C2C; }
    .start { left: 61pt; top: 39pt; }
    .end { right: 28pt; bottom: 35pt; background: #8C7851; }
    .legend h2 { font-size: 17pt; font-weight: 850; color: #2C2C2C; line-height: 1.25; }
    .legend p { margin-top: 8pt; font-size: 12.5pt; font-weight: 500; color: #555555; line-height: 1.48; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-badge"><p>4 제작</p></div>
    <div class="headline"><h1>이동체 안내: 화면을 벗어나 서가를 함께 둘러보는 탐색</h1></div>
    <div class="compare">
      <div class="card phone"><h2>화면만 보는 안내</h2><p>사용자는 계속 스마트폰을 확인해야 해서 주변 서가와 우연한 발견을 놓치기 쉽습니다.</p></div>
      <div class="card robot"><h2>이동체를 따라가는 안내</h2><p>시선은 매장에 남고, 이동체는 길을 안내하며 카트처럼 탐색 피로를 줄입니다.</p></div>
    </div>
    <div class="map">
      <div class="route">
        <div class="shelf s1"></div><div class="shelf s2"></div><div class="shelf s3"></div>
        <div class="path"></div><div class="dot start"></div><div class="dot end"></div>
      </div>
      <div class="legend"><h2>추천 책까지 가는 동안, 근처의 관련 도서도 자연스럽게 발견합니다.</h2><p>안내의 목적은 최단 경로만이 아니라, 서점이라는 공간을 더 오래 보고 더 쉽게 탐색하게 만드는 것입니다.</p></div>
    </div>
  </div>
</body></html>
