<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #B8C4B8; overflow: hidden; color: #1A1A1A; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 100%; height: 100%; padding: 34pt 46pt 30pt; display: flex; flex-direction: column; gap: 24pt; }
    .header { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1.5pt solid #2D2D2D; padding-bottom: 12pt; }
    .header h1 { font-size: 30pt; font-weight: 700; line-height: 1.22; color: #2D2D2D; }
    .header p { font-size: 12pt; font-weight: 600; color: #F8FAF8; background: #2D2D2D; padding: 4pt 10pt; border-radius: 99pt; }
    .agenda { flex: 1; display: grid; grid-template-columns: 1fr 1fr; column-gap: 34pt; row-gap: 13pt; align-content: center; }
    .item { display: grid; grid-template-columns: 34pt 1fr; gap: 13pt; align-items: start; }
    .num p { width: 25pt; height: 25pt; border-radius: 50%; background: #F8FAF8; color: #2D2D2D; font-size: 11pt; font-weight: 700; line-height: 25pt; text-align: center; }
    .copy h2 { font-size: 17pt; font-weight: 700; line-height: 1.32; color: #2D2D2D; }
    .copy p { margin-top: 4pt; font-size: 11pt; font-weight: 500; line-height: 1.38; color: #3D3D3D; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="header">
      <h1>목차</h1>
      <p></p>
    </div>
    <div class="agenda">
      <div class="item"><div class="num"><p>1</p></div><div class="copy"><h2>1) 목표</h2><p>브레인스토밍과 제한요건을 반영한 설계 목표</p></div></div>
      <div class="item"><div class="num"><p>2</p></div><div class="copy"><h2>2) 합성</h2><p>관련 기술 조사와 제작 가능한 서비스 설계안</p></div></div>
      <div class="item"><div class="num"><p>3</p></div><div class="copy"><h2>3) 분석</h2><p>시장·사용자·채널 자료 수집 및 유용성 분석</p></div></div>
      <div class="item"><div class="num"><p>4</p></div><div class="copy"><h2>4) 제작</h2><p>설계서에 따른 시연영상, 취향파악, 이동체 구현</p></div></div>
      <div class="item"><div class="num"><p>5</p></div><div class="copy"><h2>5) 시험</h2><p>결과물의 기능, 안정성, 지속 구동 가능성 테스트</p></div></div>
      <div class="item"><div class="num"><p>6</p></div><div class="copy"><h2>6) 평가</h2><p>경제성·사회적 영향·윤리성·심미성·안전성·생산성 및 내구성</p></div></div>
    </div>
  </div>


</body></html>
