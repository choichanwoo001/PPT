<!DOCTYPE html>
<html lang="ko"><head>

  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #B8C4B8; overflow: hidden; color: #1A1A1A; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 100%; height: 100%; position: relative; padding: 42pt 54pt 36pt; display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 34pt; align-items: center; }
    .section-badge { position: absolute; top: 16pt; left: 30pt; }
    .section-badge p { display: inline-block; font-size: 10.5pt; font-weight: 800; color: #F8FAF8; background: #2D2D2D; padding: 4pt 10pt; border-radius: 99pt; line-height: 1.1; }
    .term { border-left: 8pt solid #2D2D2D; padding-left: 20pt; display: flex; flex-direction: column; gap: 10pt; }
    .term p { font-size: 13pt; font-weight: 700; color: #F8FAF8; line-height: 1.2; }
    .term h1 { font-size: 43pt; font-weight: 800; color: #2D2D2D; line-height: 1.18; letter-spacing: 0; }
    .definition { background: #F8FAF8; border-radius: 8pt; padding: 20pt 24pt; display: flex; flex-direction: column; gap: 12pt; }
    .definition h2 { font-size: 20pt; font-weight: 700; color: #2D2D2D; line-height: 1.28; }
    .definition p { font-size: 13pt; font-weight: 400; color: #3D3D3D; line-height: 1.44; }
    .definition p strong { color: #1A1A1A; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-badge"><p>1 목표</p></div>
    <div class="term">
      <h1>독서 편식</h1>
      <p>우리는 이 현상을 이렇게 정의했습니다.</p>
    </div>
    <div class="definition">
      <h2>다양한 책을 접하고 싶은 욕구는 있지만, 결국 익숙하고 검증된 책으로만 손이 가는 구조적 현상</h2>
      <p>독서 편식은 단순한 취향의 좁음이 아니라, 새로운 책을 선택하는 과정에서 발생하는 <strong>불확실성과 부담</strong>이 만든 소비 패턴입니다.</p>
    </div>
  </div>



</body></html>
