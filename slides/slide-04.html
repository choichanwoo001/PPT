<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #B8C4B8;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 22pt 36pt 0;
      display: flex;
      flex-direction: column;
      gap: 10pt;
    }

    .headline h2 {
      font-size: 18pt;
      font-weight: 600;
      color: #1A1A1A;
      line-height: 1.35;
      letter-spacing: -0.02em;
      padding: 0 2pt;
    }

    .hero {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 14pt;
    }

    .chart-panel {
      background: #F8FAF8;
      border-radius: 10pt;
      padding: 12pt 14pt 10pt;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .chart-panel .caption {
      font-size: 10pt;
      font-weight: 500;
      color: #3D3D3D;
      line-height: 1.3;
      margin-bottom: 4pt;
    }
    .chart-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    .chart-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .narrative {
      display: flex;
      flex-direction: column;
      gap: 10pt;
      min-height: 0;
    }
    .narrative-block {
      background: #F8FAF8;
      border-radius: 10pt;
      padding: 12pt 14pt;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6pt;
    }
    .narrative-block p {
      font-size: 11.5pt;
      font-weight: 400;
      color: #3D3D3D;
      line-height: 1.48;
    }
    .narrative-block p strong {
      font-weight: 600;
      color: #1A1A1A;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8pt;
      background: #A3B0A3;
      border-radius: 10pt;
      padding: 10pt 14pt;
    }
    .badge-row .badge {
      font-size: 11pt;
      font-weight: 600;
      color: #F8FAF8;
      background: #2D2D2D;
      padding: 4pt 10pt;
      border-radius: 4pt;
      line-height: 1.2;
    }
    .badge-row .icon {
      width: 16pt;
      height: 16pt;
      color: #2D2D2D;
      stroke-width: 2.2;
    }
    .badge-row p {
      font-size: 11pt;
      font-weight: 500;
      color: #1A1A1A;
      line-height: 1.35;
    }

    .conclusion {
      background: #2D2D2D;
      margin: 0 -36pt;
      padding: 12pt 36pt 14pt;
      text-align: center;
    }
    .conclusion p {
      font-size: 13pt;
      font-weight: 600;
      color: #F8FAF8;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="headline">
      <h2>저희가 주목한 대상은 20–30대입니다.</h2>
    </div>

    <div class="hero">
      <div class="chart-panel">
        <p class="caption">독립서점 방문객 · 2030세대 비중</p>
        <div class="chart-wrap">
          <canvas id="visitorChart"></canvas>
        </div>
      </div>

      <div class="narrative">
        <div class="narrative-block">
          <p>단순히 젊은 세대이기 때문이 아니라, 독서를 ‘제품 소비’가 아닌 <strong>취향을 발견하고 쌓아가는 문화적 경험</strong>으로 접근하는 세대입니다.</p>
        </div>
        <div class="badge-row">
          <p class="badge">2030</p>
          <i data-lucide="trending-up" class="icon"></i>
          <p>독서율 · 타 세대 대비 높음</p>
        </div>
        <div class="narrative-block">
          <p>이들은 <strong>접근성의 불편함을 감수</strong>하면서까지 독립서점을 찾아갑니다. 서점에서 취향을 발견하고, <strong>큐레이션된 선택지</strong>를 경험하고 싶기 때문입니다.</p>
        </div>
      </div>
    </div>

    <div class="conclusion">
      <p>즉 2030에게는 수동적인 추천보다 능동적인 발견의 경험이 중요합니다.</p>
    </div>
  </div>

  <script>
    lucide.createIcons();

    new Chart(document.getElementById('visitorChart'), {
      type: 'doughnut',
      data: {
        labels: ['2030세대', '기타'],
        datasets: [{
          data: [79.1, 20.9],
          backgroundColor: ['#2D2D2D', '#9AA89A'],
          borderWidth: 0
        }]
      },
      options: {
        animation: false,
        responsive: true,
        maintainAspectRatio: false,
        cutout: '58%',
        plugins: {
          legend: { position: 'bottom', labels: { font: { size: 10, family: 'Pretendard' }, boxWidth: 10, padding: 8 } },
          tooltip: {
            callbacks: {
              label: (ctx) => ctx.label + ': ' + ctx.parsed + '%'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
