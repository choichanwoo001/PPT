<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #FDFCF8; overflow: hidden; color: #1A1A1A; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 720pt; height: 405pt; overflow: hidden; position: relative; padding: 25pt 32pt 28pt; display: flex; flex-direction: column; gap: 16pt; background: #FDFCF8; }
    .header { display: flex; justify-content: space-between; align-items: flex-end; gap: 22pt; }
    .title { max-width: 488pt; }
    .title p { display: inline-block; font-size: 10.5pt; font-weight: 850; line-height: 1.1; color: #FDFCF8; background: #2C2C2C; padding: 4pt 10pt; border-radius: 99pt; }
    .title h1 { margin-top: 9pt; font-size: 26pt; font-weight: 850; line-height: 1.18; letter-spacing: 0; color: #2C2C2C; }
    .note { width: 148pt; padding: 8pt 10pt; border: 1.2pt solid rgba(44, 44, 44, 0.32); border-radius: 8pt; background: #E5D1B3; }
    .note p { font-size: 10.4pt; font-weight: 750; line-height: 1.42; color: #2C2C2C; }
    .story { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12pt; min-height: 0; }
    .panel { position: relative; min-height: 0; border-radius: 8pt; overflow: visible; background: #EFE2CF; border: 1.2pt solid rgba(44, 44, 44, 0.22); box-shadow: 0 8pt 18pt rgba(44, 44, 44, 0.12); }
    .panel:not(:last-child)::before { content: "→"; position: absolute; right: -16pt; top: 49%; z-index: 5; width: 20pt; height: 20pt; border-radius: 99pt; background: #2C2C2C; color: #FDFCF8; font-size: 12pt; font-weight: 850; line-height: 20pt; text-align: center; box-shadow: 0 4pt 10pt rgba(44, 44, 44, 0.18); }
    .panel img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 8pt; }
    .panel::after { content: ""; position: absolute; inset: 0; border-radius: 8pt; background: rgba(44, 44, 44, 0.12); pointer-events: none; }
    .stage { position: absolute; left: 10pt; top: 10pt; z-index: 2; background: #2C2C2C; border-radius: 99pt; padding: 4pt 8pt; }
    .stage p { font-size: 9.5pt; font-weight: 850; line-height: 1; color: #FDFCF8; }
    .bubble { position: absolute; left: 12pt; right: 12pt; bottom: 12pt; z-index: 2; padding: 11pt 12pt 10pt; border-radius: 8pt; background: #FDFCF8; border: 1.1pt solid rgba(44, 44, 44, 0.24); box-shadow: 0 6pt 14pt rgba(44, 44, 44, 0.16); }
    .bubble::before { content: ""; position: absolute; left: 22pt; top: -7pt; width: 15pt; height: 15pt; background: #FDFCF8; border-left: 1.1pt solid rgba(44, 44, 44, 0.24); border-top: 1.1pt solid rgba(44, 44, 44, 0.24); transform: rotate(45deg); border-radius: 2pt; }
    .bubble h2 { position: relative; z-index: 1; font-size: 12.2pt; font-weight: 850; line-height: 1.2; color: #2C2C2C; }
    .bubble p { position: relative; z-index: 1; margin-top: 5pt; font-size: 13pt; font-weight: 750; line-height: 1.34; color: #2C2C2C; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="header">
      <div class="title">
        <p>대상 사용자</p>
        <h1>대형 서점에서 책을 고르다<br>지치는 사람들</h1>
      </div>
      
    </div>
    <div class="story">
      <div class="panel">
        <img src="./assets/slide-04-entrance.png" alt="대형 서점 입구에서 압도감을 느끼는 사람">
        <div class="stage"><p>01 서점 입구</p></div>
        <div class="bubble">
          <h2>처음 들어왔을 때</h2>
          <p>너무 뭐가 많다... 어디부터, 뭐부터 봐야 하지?</p>
        </div>
      </div>
      <div class="panel">
        <img src="./assets/slide-04-middle.png" alt="대형 서점 중간에서 책을 하나씩 보며 지친 사람">
        <div class="stage"><p>02 둘러보는 중</p></div>
        <div class="bubble">
          <h2>한참 걷다 보면</h2>
          <p>추천이나 정리된 게 없으니 하나하나 다 봐야 하고, 슬슬 지친다.</p>
        </div>
      </div>
      <div class="panel">
        <img src="./assets/slide-04-bestseller.png" alt="대형 서점 베스트셀러 코너 앞에서 망설이는 사람">
        <div class="stage"><p>03 마지막 선택</p></div>
        <div class="bubble">
          <h2>결국 마지막에는</h2>
          <p>맘에 드는 책을 못 고르겠어... 그냥 베스트셀러나 살까?</p>
        </div>
      </div>
    </div>
  </div>


</body></html>
