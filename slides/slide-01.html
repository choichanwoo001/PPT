<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #B8C4B8; overflow: hidden; color: #1A1A1A; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 100%; height: 100%; padding: 44pt 54pt 34pt; display: flex; flex-direction: column; justify-content: space-between; }
    .hello p { font-size: 15pt; font-weight: 500; color: #2D2D2D; line-height: 1.4; }
    .title { display: flex; flex-direction: column; gap: 12pt; }
    .title h1 { font-size: 60pt; font-weight: 700; letter-spacing: 0; line-height: 1.12; color: #2D2D2D; }
    .title h2 { max-width: 470pt; font-size: 21pt; font-weight: 500; line-height: 1.32; color: #F8FAF8; }
    .bar { width: 112pt; height: 8pt; background: #2D2D2D; border-radius: 99pt; }
    .team { display: grid; grid-template-columns: 1fr 1.35fr; gap: 14pt; padding: 12pt 14pt; background: rgba(248, 250, 248, 0.35); border: 1.2pt solid rgba(45, 45, 45, 0.28); border-radius: 8pt; }
    .team p { font-size: 10.5pt; font-weight: 600; color: #2D2D2D; line-height: 1.45; }
    .team strong { font-weight: 800; }
    .footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 18pt; }
    .footer > p { font-size: 12pt; font-weight: 500; color: #2D2D2D; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="hello">
      <p></p>
    </div>
    <div class="title">
      <div class="bar"></div>
      <h1>산책<br></h1>
      <h2>LLM 기반 추천 에이전트와 자율주행이 <br>결합된 O2O 도서 탐색 플랫폼</h2>
    </div>
    <div class="footer">
      <div class="team">
        <p>6조 <br>최찬우	22011979<br>조아라	23011971<br>손영진	20011455 <br>박민석	22011934</p>
        <p></p>
      </div>
      <p></p>
    </div>
  </div>


</body></html>
