<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #B8C4B8; overflow: hidden; color: #1A1A1A; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 100%; height: 100%; position: relative; padding: 52pt 40pt 28pt; display: flex; flex-direction: column; gap: 12pt; }
    .section-badge { position: absolute; top: 16pt; left: 26pt; }
    .section-badge p { display: inline-block; font-size: 10.5pt; font-weight: 800; color: #F8FAF8; background: #2D2D2D; padding: 4pt 10pt; border-radius: 99pt; line-height: 1.1; }
    .headline h1 { font-size: 25pt; font-weight: 700; line-height: 1.25; color: #2D2D2D; }
    .thesis { background: #2D2D2D; border-radius: 8pt; padding: 19pt 24pt; }
    .thesis p { font-size: 27pt; font-weight: 700; line-height: 1.36; color: #F8FAF8; }
    .thesis p strong { color: #B8C4B8; font-weight: 800; }
    .logic { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10pt; }
    .step { background: #F8FAF8; border-radius: 8pt; padding: 15pt 16pt; display: flex; flex-direction: column; gap: 10pt; }
    .step h2 { font-size: 14.5pt; font-weight: 700; color: #2D2D2D; line-height: 1.4; }
    .step p { font-size: 12pt; font-weight: 400; color: #3D3D3D; line-height: 1.48; }
    .closing p { font-size: 14pt; font-weight: 700; color: #2D2D2D; line-height: 1.42; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-badge"><p>3 분석</p></div>
    <div class="headline">
      <h1>독립서점의 증가는 사람들이 다양한 발견을 원한다는 근거입니다.</h1>
    </div>
    <div class="thesis">
      <p>사람들은 단순히 베스트셀러만 사고 싶은 것이 아닙니다.</p>
    </div>
    <div class="logic">
      <div class="step"><h2>주제별 큐레이션</h2><p>책의 수는 적지만 선택을 돕는 기준이 분명합니다.</p></div>
      <div class="step"><h2>서점 주인의 추천</h2><p>누군가 정리해주고 제안해주는 환경을 제공합니다.</p></div>
      <div class="step"><h2>짧은 소개 문구</h2><p>낯선 책도 부담 없이 살펴볼 수 있게 만듭니다.</p></div>
    </div>
    <div class="closing">
      <p>독립서점의 증가는 다양한 책을 찾고 싶은 욕구가 여전히 존재한다는 근거가 됩니다.</p>
    </div>
  </div>


</body></html>
