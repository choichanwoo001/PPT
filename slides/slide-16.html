<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #2D2D2D; overflow: hidden; color: #F8FAF8; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 100%; height: 100%; position: relative; padding: 54pt 42pt 30pt; display: grid; grid-template-columns: 0.82fr 1.18fr; gap: 24pt; }
    .section-badge { position: absolute; top: 16pt; left: 28pt; }
    .section-badge p { display: inline-block; font-size: 10.5pt; font-weight: 800; color: #2D2D2D; background: #B8C4B8; padding: 4pt 10pt; border-radius: 99pt; line-height: 1.1; }
    .title { display: flex; flex-direction: column; justify-content: space-between; border-right: 1.5pt solid rgba(248, 250, 248, 0.28); padding-right: 22pt; }
    .title h1 { font-size: 27pt; font-weight: 800; line-height: 1.28; color: #F8FAF8; }
    .title p { font-size: 11.5pt; font-weight: 600; line-height: 1.45; color: #B8C4B8; }
    .content { display: flex; flex-direction: column; justify-content: center; gap: 13pt; }
    .card { background: #F8FAF8; border-radius: 8pt; padding: 15pt 17pt; }
    .card h2 { font-size: 16pt; font-weight: 800; color: #2D2D2D; line-height: 1.25; }
    .card p { margin-top: 6pt; font-size: 11.8pt; font-weight: 500; color: #3D3D3D; line-height: 1.46; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-badge"><p>6 평가</p></div>
    <div class="title">
      <h1>윤리성 측면</h1>
      <p>취향 데이터와 추천 투명성</p>
    </div>
    <div class="content">
      <div class="card"><h2>기여 방식</h2><p>취향 데이터를 다루기 때문에 최소한의 데이터만 수집하고, 추천 이유를 함께 제시해야 합니다.</p></div>
      <div class="card"><h2>평가 및 개선</h2><p>사용자가 추천 기록을 삭제하거나 취향을 재설정할 수 있어야 하며, 광고와 추천도 명확히 구분되어야 합니다.</p></div>
    </div>
  </div>


</body></html>
