<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #2C2C2C; overflow: hidden; color: #FDFCF8; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 720pt; height: 405pt; overflow: hidden; position: relative; padding: 46pt 44pt 26pt; display: flex; flex-direction: column; gap: 12pt; }
    .section-badge { position: absolute; top: 18pt; left: 30pt; }
    .section-badge p { display: inline-block; font-size: 10.5pt; font-weight: 800; color: #2C2C2C; background: #E5D1B3; padding: 4pt 10pt; border-radius: 99pt; line-height: 1.1; }
    .question h1 { max-width: 620pt; font-size: 29pt; font-weight: 800; line-height: 1.24; letter-spacing: 0; color: #FDFCF8; }
    .scene { flex: 1; position: relative; min-height: 208pt; }
    .quotes { position: absolute; inset: 0; }
    .quote-card { position: absolute; display: flex; align-items: center; gap: 10pt; }
    .quote-card.one { left: -22pt; top: 16pt; width: 205pt; }
    .quote-card.two { left: 106pt; top: 171pt; width: 214pt; }
    .quote-card.three { left: 420pt; top: 56pt; width: 216pt; }
    .speaker-left { flex-direction: row-reverse; }
    .bubble { position: relative; flex: 1; min-height: 92pt; background: #FDFCF8; border-radius: 8pt; padding: 12pt 12pt 10pt; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10pt 18pt rgba(0, 0, 0, 0.14); }
    .bubble::before { content: ""; position: absolute; top: 42pt; width: 16pt; height: 16pt; background: #FDFCF8; transform: rotate(45deg); border-radius: 3pt; }
    .speaker-right .bubble::before { right: -7pt; }
    .speaker-left .bubble::before { left: -7pt; }
    .bubble h2 { font-size: 13pt; font-weight: 800; color: #2C2C2C; line-height: 1.2; }
    .bubble p { font-size: 11.5pt; font-weight: 650; color: #2C2C2C; line-height: 1.37; }
    .mascot { width: 58pt; height: 58pt; flex: 0 0 58pt; align-self: flex-end; object-fit: contain; filter: drop-shadow(0 9pt 12pt rgba(0, 0, 0, 0.24)); }
    .quote-card.one .mascot { transform: rotate(-4deg); }
    .quote-card.two .mascot { width: 64pt; height: 64pt; flex-basis: 64pt; transform: rotate(5deg); }
    .quote-card.three .mascot { transform: rotate(3deg); }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-badge"><p>1 목표</p></div>
    <div class="question">
      <h1>대형서점에서 책을 고를 때, 이런 경험이 있나요?</h1>
    </div>
    <div class="scene">
      <div class="quotes">
        <div class="quote-card one speaker-right">
          <div class="bubble"><h2>사용자 1</h2><p>새로운 책을 찾으러 왔는데, 결국 베스트셀러만 보게 돼.</p></div>
          <img class="mascot" src="./assets/sanchaek-mascot.png" alt="산책 캐릭터">
        </div>
        <div class="quote-card two speaker-left">
          <div class="bubble"><h2>사용자 2</h2><p>샀다가 재미없으면 돈도 시간도 아까워.</p></div>
          <img class="mascot" src="./assets/sanchaek-mascot.png" alt="산책 캐릭터">
        </div>
        <div class="quote-card three speaker-right">
          <div class="bubble"><h2>사용자 3</h2><p>한참 둘러봤는데, 손에 든 책은 하나도 없어.</p></div>
          <img class="mascot" src="./assets/sanchaek-mascot.png" alt="산책 캐릭터">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
