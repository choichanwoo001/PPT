<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #2D2D2D; overflow: hidden; color: #F8FAF8; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 100%; height: 100%; position: relative; padding: 50pt 54pt 36pt; display: flex; flex-direction: column; justify-content: center; gap: 24pt; }
    .kicker { display: none; }
    .section-badge { position: absolute; top: 18pt; left: 30pt; }
    .section-badge p { display: inline-block; font-size: 10.5pt; font-weight: 800; color: #2D2D2D; background: #B8C4B8; padding: 4pt 10pt; border-radius: 99pt; line-height: 1.1; }
    .question h1 { max-width: 590pt; font-size: 35pt; font-weight: 700; line-height: 1.32; letter-spacing: 0; color: #F8FAF8; }
    .question h1 strong { color: #B8C4B8; font-weight: 700; }
    .note p { max-width: 470pt; font-size: 14pt; font-weight: 400; line-height: 1.55; color: #D7DDD7; }
    .rule { position: absolute; right: 50pt; bottom: 38pt; width: 120pt; height: 7pt; border-radius: 99pt; background: #B8C4B8; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-badge"><p>1 목표</p></div>
    <div class="kicker"><p>1) 목표</p></div>
    <div class="question">
      <h1 style="font-size: 45px;">여러분이 마지막으로 베스트셀러가 아닌 책을 직접  취향에 따라 골라 산 게 언제였나요?<br></h1>
    </div>
    <div class="note">
      <p>좋아할 책을 찾기보다, 실패하지 않을 책을 찾게 됩니다.</p>
    </div>
    <div class="rule"></div>
  </div>


</body></html>
