<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 720pt; height: 405pt; font-family: 'Pretendard', sans-serif; background: #B8C4B8; overflow: hidden; color: #1A1A1A; }
    h1, h2, h3, p, li { padding-bottom: 0.1em; }
    .slide { width: 100%; height: 100%; position: relative; padding: 50pt 36pt 0; display: flex; flex-direction: column; gap: 15pt; }
    .section-badge { position: absolute; top: 16pt; left: 24pt; }
    .section-badge p { display: inline-block; font-size: 10.5pt; font-weight: 800; color: #F8FAF8; background: #2D2D2D; padding: 4pt 10pt; border-radius: 99pt; line-height: 1.1; }
    .headline h1 { font-size: 22pt; font-weight: 700; color: #2D2D2D; line-height: 1.34; }
    .proof { flex: 1; min-height: 0; display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 14pt; }
    .panel { background: #F8FAF8; border-radius: 8pt; padding: 16pt 16pt; display: flex; flex-direction: column; justify-content: flex-start; min-height: 0; }
    .panel h2 { font-size: 13.5pt; font-weight: 700; color: #2D2D2D; line-height: 1.35; }
    .share-metric { margin: 24pt 0 0; padding: 19pt 0 0; border-top: 1pt solid #D7DDD7; }
    .metric { display: grid; grid-template-columns: 86pt 1fr; gap: 13pt; align-items: end; }
    .metric h3 { font-size: 30pt; font-weight: 800; line-height: 1.12; color: #2D2D2D; letter-spacing: 0; }
    .metric p { font-size: 10pt; font-weight: 700; color: #3D3D3D; line-height: 1.28; }
    .share-track { height: 18pt; margin-top: 12pt; background: #D7DDD7; border-radius: 3pt; overflow: hidden; }
    .share-fill { width: 81%; height: 100%; background: #2D2D2D; border-radius: 3pt 0 0 3pt; }
    .scale { display: flex; justify-content: space-between; margin-top: 5pt; }
    .scale p { font-size: 8.5pt; color: #596159; line-height: 1.2; }
    .week-list { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12pt; align-items: stretch; margin-top: 28pt; }
    .week-card { border-left: 4pt solid #2D2D2D; background: #EEF2EE; padding: 18pt 14pt 16pt; display: flex; flex-direction: column; justify-content: space-between; min-height: 132pt; }
    .week-card h3 { font-size: 14pt; font-weight: 800; color: #2D2D2D; line-height: 1.35; }
    .week-card p { font-size: 30pt; font-weight: 800; color: #2D2D2D; line-height: 1.14; letter-spacing: 0; }
    .week-card p span { font-size: 16pt; font-weight: 800; }
    .insight { margin: 0 -36pt; padding: 13pt 36pt 15pt; background: #2D2D2D; }
    .insight p { font-size: 18pt; font-weight: 700; line-height: 1.36; color: #F8FAF8; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-badge"><p>3 분석</p></div>
    <div class="headline">
      <h1>이 현상은 사람들이 다양한 책을 원하지 않는다는 뜻은 아닙니다.</h1>
    </div>
    <div class="proof">
      <div class="panel">
        <h2>독서 편식</h2>
        <div class="share-metric">
          <div class="metric"><h3>욕구</h3><p>새로운 책과<br>맞는 책을 찾고 싶음</p></div>
          <div class="share-track"><div class="share-fill"></div></div>
          <div class="scale"><p>발견</p><p>안전한 선택</p></div>
        </div>
      </div>
      <div class="panel">
        <h2>실제 행동</h2>
        <div class="week-list">
          <div class="week-card"><h3>탐색 피로</h3><p>선택<span>부담</span></p></div>
          <div class="week-card"><h3>베스트셀러</h3><p>안전<span>선택</span></p></div>
        </div>
      </div>
    </div>
    <div class="insight">
      <p>문제는 취향이 좁어서가 아니라, 다양한 책을 고르기까지의 과정이 어렵고 피곤하다는 데 있습니다.</p>
    </div>
  </div>



</body></html>
